name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # "v1.2.3" → 1.2.3 on tag builds; untagged builds keep 1.0.0.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test -c Release

      # Windows / Linux: self-contained publish of the app folder.
      - name: Publish
        if: runner.os != 'macOS'
        shell: bash
        run: dotnet publish src/UVCControl.App -c Release -r ${{ matrix.rid }} --self-contained -o "build/publish-${{ matrix.rid }}" -p:Version="$VERSION"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/publish-${{ matrix.rid }}/*" -DestinationPath "build/UVCControl-${{ matrix.rid }}.zip"

      # tar keeps the executable bit, which a zip artifact would lose.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "build/UVCControl-${{ matrix.rid }}.tar.gz" -C "build/publish-${{ matrix.rid }}" .

      # macOS: bundle "UVC Control.app" (Info.plist with the camera usage string, ad-hoc signature).
      # ditto keeps the bundle's symlinks, permissions and signature intact.
      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          sh scripts/build-macos-app.sh ${{ matrix.rid }}
          ditto -c -k --keepParent "build/UVC Control.app" "build/UVCControl-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: UVCControl-${{ matrix.rid }}
          path: |
            build/UVCControl-${{ matrix.rid }}.zip
            build/UVCControl-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A tag with a suffix (v1.2.0-beta.1) is published as a pre-release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "UVC Control $TAG" --generate-notes $flags
